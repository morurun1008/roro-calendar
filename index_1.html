<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>蠟梅様活動記録</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>蠟梅様活動記録</h1>

<p class="description">
    蠟梅様の活動や記念日をまとめた記録ページです。
</p>

<p class="description">
日付検索、ワード検索ができ、日付を押すとその日に投稿された作品の全文が表示されます。また、検索しやすいように作品タイトルの検索避けを修正してあります。
</p>

<p class="description">
例：氵んだ→死んだ、うiわiき→浮気、🥫キ冫→🥫監禁　など…
</p>

<p class="description">
※キャラクターの絵文字やモブ男女の絵文字はそのままなので絵文字で検索をお願いします。リクエスト作品は「リク」と入力してください。

</p>

<p class="description">
    <a href="https://lit.link/mrmr_13" target="_blank">
        蠟梅様の使っているキャラ絵文字一覧はこちら →
    </a>
</p>

   <div>
    <input type="date" id="search-date">
    <button id="search-button">検索</button>
</div>

<div id="search-result"></div>

<div id="title-search">
    <input type="text" id="search-title" placeholder="作品名を検索">
    <button id="title-search-button">検索</button>
</div>

<div id="title-search-result"></div>

<div id="selected-date-result"></div>

<div id="calendar"></div>

<script src="script.js"></script>

</body>

</html>
